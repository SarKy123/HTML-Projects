<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tennis Rumble</title>

<style>
    body {
        display: flex;
        flex-direction: column;
        align-items: center;
        background: black;
        color: white;
        font-family: Arial, sans-serif;
    }

    canvas {
        border: 2px solid white;
        background: green;
    }

    #score {
        font-size: 22px;
        margin: 10px;
    }

    button {
        padding: 8px 16px;
        font-size: 16px;
        margin-top: 10px;
        cursor: pointer;
    }
</style>
</head>

<body>

<h1>Tennis Rumble</h1>
<div id="score">Player 1: 0 | Player 2: 0</div>
<canvas id="gameCanvas" width="800" height="400"></canvas>
<button id="resetBtn">Reset Game</button>
<h3>NOTE:</h3>
<h3>Player 1: W / S | Player 2: ↑ / ↓</h3>
<h3>Press SPACE to start</h3>

<script>

// GAME DISPLAY
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const scoreDisplay = document.getElementById("score");

// CONSTANT VARIABLES
const PADDLE_SPEED = 6;
const BALL_START_SPEED = 4;
const SPEED_INCREASE = 1.08;
const MAX_SPEED = 15;
const WIN_SCORE = 5;

// GAME STATE
let gameStarted = false;
let keys = {};

// GAME OBJECTS/VARIABLES
let ball = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    radius: 10,
    dx: 0,
    dy: 0
};

let paddle1 = {
    x: 0,
    y: canvas.height / 2 - 50,
    width: 10,
    height: 100
};

let paddle2 = {
    x: canvas.width - 10,
    y: canvas.height / 2 - 50,
    width: 10,
    height: 100
};

let score1 = 0;
let score2 = 0;

// KEY EVENTS / USER INPUTS
window.addEventListener("keydown", e => {
    if (["ArrowUp", "ArrowDown", "KeyW", "KeyS", "Space"].includes(e.code)) {
        e.preventDefault();
    }

    keys[e.code] = true;

    if (e.code === "Space" && !gameStarted) {
        gameStarted = true;
        startBall();
    }
});

window.addEventListener("keyup", e => {
    keys[e.code] = false;
});

// STARTING THE GAME
function startBall() {
    ball.x = canvas.width / 2;
    ball.y = canvas.height / 2;

    //DIRECTION OF THE BALL
    const direction = Math.random() < 0.5 ? -1 : 1;

    //ANGLE RANGE: 45deg to 45deg
    const angle = (Math.random() * Math.PI/2) - (Math.PI / 4);

    ball.dx = Math.cos(angle) * BALL_START_SPEED * direction;
    ball.dy = Math.sin(angle) * BALL_START_SPEED;
}

// ---------- UPDATE ----------
function update() {

    // PLAYER/PADDLE MOVEMNTS
    if (keys["KeyW"] && paddle1.y > 0) paddle1.y -= PADDLE_SPEED;
    if (keys["KeyS"] && paddle1.y < canvas.height - paddle1.height) paddle1.y += PADDLE_SPEED;

    if (keys["ArrowUp"] && paddle2.y > 0) paddle2.y -= PADDLE_SPEED;
    if (keys["ArrowDown"] && paddle2.y < canvas.height - paddle2.height) paddle2.y += PADDLE_SPEED;

    if (!gameStarted) return;

    //BALL MOVEMENT
    ball.x += ball.dx;
    ball.y += ball.dy;

    // WALL COLLISION
    if (ball.y <= ball.radius || ball.y >= canvas.height - ball.radius) {
        ball.dy *= -1;
    }

    // PADDLE 1 COLLISITION
    if (
        ball.x - ball.radius <= paddle1.x + paddle1.width &&
        ball.y >= paddle1.y &&
        ball.y <= paddle1.y + paddle1.height
    ) {
        ball.dx = Math.abs(ball.dx) * SPEED_INCREASE;
        ball.dy *= SPEED_INCREASE;
        limitSpeed();
    }

    // PADDLE 2 COLLISITIOn
    if (
        ball.x + ball.radius >= paddle2.x &&
        ball.y >= paddle2.y &&
        ball.y <= paddle2.y + paddle2.height
    ) {
        ball.dx = -Math.abs(ball.dx) * SPEED_INCREASE;
        ball.dy *= SPEED_INCREASE;
        limitSpeed();
    }

    // Scoring
    if (ball.x < 0) {
        score2++;
        gameStarted = false;
    }

    if (ball.x > canvas.width) {
        score1++;
        gameStarted = false;
    }

    // Win condition
    if (score1 >= WIN_SCORE) {
        alert("Player 1 Wins!");
        resetGame();
    }
    if (score2 >= WIN_SCORE) {
        alert("Player 2 Wins!");
        resetGame();
    }

    scoreDisplay.textContent = `Player 1: ${score1} | Player 2: ${score2}`;
}

// ---------- SPEED LIMIT ----------
function limitSpeed() {
    if (Math.abs(ball.dx) > MAX_SPEED)
        ball.dx = Math.sign(ball.dx) * MAX_SPEED;

    if (Math.abs(ball.dy) > MAX_SPEED)
        ball.dy = Math.sign(ball.dy) * MAX_SPEED;
}

// ---------- DRAW ----------
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "white";
    ctx.fillRect(paddle1.x, paddle1.y, paddle1.width, paddle1.height);
    ctx.fillRect(paddle2.x, paddle2.y, paddle2.width, paddle2.height);

    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
    ctx.fill();
}

// ---------- LOOP ----------
function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}
gameLoop();

// ---------- RESET ----------
document.getElementById("resetBtn").onclick = resetGame;

function resetGame() {
    score1 = 0;
    score2 = 0;
    gameStarted = false;

    paddle1.y = canvas.height / 2 - 50;
    paddle2.y = canvas.height / 2 - 50;

    ball.x = canvas.width / 2;
    ball.y = canvas.height / 2;
    ball.dx = 0;
    ball.dy = 0;

    scoreDisplay.textContent = "Player 1: 0 | Player 2: 0";
}
</script>

</body>
</html>
